<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Smart Mess Queue Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Viewport -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4">
        <div>
            <div class="flex items-center gap-2 mb-8">
                <div class="bg-emerald-500 p-2 rounded-lg text-slate-950 font-black">3D</div>
                <div>
                    <h1 class="font-bold text-sm">SMART MESS</h1>
                    <p class="text-[10px] text-slate-400">QUEUE MANAGER</p>
                </div>
            </div>
            <nav class="space-y-2">
                <a href="#viewport" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-emerald-500/10 text-emerald-400 text-xs font-semibold">3D Live Viewport</a>
            </nav>
        </div>
        <div class="text-xs text-slate-500 border-t border-slate-800 pt-4">
            <p class="font-bold text-slate-400">K. Sai Prasanna</p>
            <p>Roll: 25B21A4601</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-y-auto p-6">
        <h2 class="text-xl font-bold mb-4">LIVE SYSTEM CONTROL DASHBOARD</h2>
        
        <!-- 3D Viewport Box -->
        <div id="canvas-container" class="w-full h-72 bg-slate-900 border border-slate-800 rounded-xl mb-6 relative overflow-hidden flex items-center justify-center">
            <span class="text-slate-500 text-sm">Loading 3D Viewport...</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Issue Token Form -->
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                <h3 class="font-bold text-sm mb-4 text-emerald-400">Issue Student Token</h3>
                <form id="tokenForm" class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">STUDENT NAME</label>
                        <input type="text" id="studentName" required placeholder="e.g. K. Sai Prasanna" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">ROLL NUMBER</label>
                            <input type="text" id="rollNumber" value="25B21A4601" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">PHONE NUMBER</label>
                            <input type="text" id="phoneNum" value="8106129837" required class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">FOOD ITEM SELECT</label>
                        <select id="foodItem" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="Special Thali Meals">Special Thali Meals</option>
                            <option value="Chicken Biryani">Chicken Biryani</option>
                            <option value="Veg Fried Rice">Veg Fried Rice</option>
                            <option value="South Indian Meals">South Indian Meals</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded text-sm transition">
                        GENERATE TOKEN & SEND SMS
                    </button>
                </form>
            </div>

            <!-- Active Queue Log -->
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl flex flex-col">
                <h3 class="font-bold text-sm mb-4 text-emerald-400">Active Queue Data Log</h3>
                <div class="flex-1 overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400">
                                <th class="pb-2">Token</th>
                                <th class="pb-2">Student</th>
                                <th class="pb-2">Phone</th>
                                <th class="pb-2">Food</th>
                                <th class="pb-2 text-right">Status</th>
                            </tr>
                        </thead>
                        <tbody id="queueTableBody">
                            <tr><td colspan="5" class="py-4 text-center text-slate-500">Queue is currently empty.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const TWILIO_ACCOUNT_SID = 'ACdef6f3673d4c9ad1c2199675057c79d0';
        const TWILIO_AUTH_TOKEN = '2cdaa9d95432f88bec8053842b48c17f';
        const TWILIO_PHONE_NUMBER = '+17372212163';

        let queueList = [];
        let tokenCounter = 101;

        // 3D Viewport Initialization with Three.js
        const container = document.getElementById('canvas-container');
        container.innerHTML = ''; // clear loading text
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const material = new THREE.MeshBasicMaterial({ color: 0x10b981, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        // Twilio SMS Function
        async function sendSMS(phone, name, token, food) {
            let formattedPhone = phone.trim();
            if (!formattedPhone.startsWith('+')) formattedPhone = '+91' + formattedPhone;

            const bodyText = `Hello ${name}, Token ${token} for ${food} is READY! Please collect it.`;
            try {
                const res = await fetch(`https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Basic ' + btoa(`${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}`),
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams({ To: formattedPhone, From: TWILIO_PHONE_NUMBER, Body: bodyText })
                });
                if(res.ok) alert("📱 Real SMS Sent Successfully!");
            } catch (err) {
                console.error(err);
            }
        }

        function renderQueue() {
            const tbody = document.getElementById('queueTableBody');
            tbody.innerHTML = '';
            if(queueList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-500">Queue is currently empty.</td></tr>`;
                return;
            }
            queueList.forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.className = idx === 0 ? "text-emerald-400 font-bold bg-emerald-950/20" : "text-slate-300";
                tr.innerHTML = `
                    <td class="py-2">${item.token}</td>
                    <td class="py-2">${item.name}</td>
                    <td class="py-2">${item.phone}</td>
                    <td class="py-2">${item.food}</td>
                    <td class="py-2 text-right">${idx === 0 ? 'SERVING' : 'WAITING'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('tokenForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('studentName').value;
            const phone = document.getElementById('phoneNum').value;
            const food = document.getElementById('foodItem').value;
            const token = `T-${tokenCounter++}`;

            queueList.push({ token, name, phone, food });
            renderQueue();
            sendSMS(phone, name, token, food);

            document.getElementById('studentName').value = '';
        });
    </script>
</body>
</html>
