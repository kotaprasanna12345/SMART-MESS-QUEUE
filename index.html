<script>
    const TWILIO_ACCOUNT_SID = 'ACdef6f3673d4c9ad1c2199675057c79d0';
    const TWILIO_AUTH_TOKEN = '2cdaa9d95432f88bec8053842b48c17f';
    const TWILIO_PHONE_NUMBER = '+17372212163';

    let queueList = [];
    let smsLogList = [];
    let tokenCounter = 101;
    let totalRevenue = 0;
    const TIME_PER_PERSON_MINS = 3; // Oka person ki 3 minutes

    function switchTab(tabId) {
        ['dashboard', 'kitchen', 'menu', 'analytics', 'smslogs'].forEach(t => {
            const tabEl = document.getElementById(`tab-${t}`);
            if(tabEl) tabEl.classList.add('hidden');
            
            const navBtn = document.getElementById(`nav-${t}`);
            if(navBtn) {
                navBtn.className = "w-full text-left flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-slate-800 text-slate-300 text-xs font-medium transition cursor-pointer";
            }
        });

        const targetTab = document.getElementById(`tab-${tabId}`);
        if(targetTab) targetTab.classList.remove('hidden');

        const activeBtn = document.getElementById(`nav-${tabId}`);
        if(activeBtn) {
            activeBtn.className = "w-full text-left flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-emerald-500/10 text-emerald-400 text-xs font-bold border border-emerald-500/25 transition cursor-pointer";
        }

        const titles = {
            'dashboard': 'SMART MESS QUEUE MANAGEMENT SYSTEM',
            'kitchen': '3D MESS HALL (FIFO QUEUE SIMULATION)',
            'menu': 'COMPLETE MESS FOOD MENU & PRICING CATALOG',
            'analytics': 'SYSTEM ANALYTICS & REVENUE REPORTS',
            'smslogs': 'TWILIO SMS NOTIFICATION LOGS'
        };
        document.getElementById('pageTitle').innerText = titles[tabId];
    }

    // FIFO Queue Rendering & Time Calculation
    function renderQueue() {
        const tbody = document.getElementById('queueTableBody');
        tbody.innerHTML = '';
        
        if(queueList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-500 italic">Queue is empty. Generate token to start FIFO sequence!</td></tr>`;
            return;
        }

        queueList.forEach((item, idx) => {
            // FIFO index batti waiting time calculation (3 mins per person ahead)
            let estimatedWaitTime = idx * TIME_PER_PERSON_MINS;
            let statusBadge = "";

            if (idx === 0) {
                statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold animate-pulse">NOW SERVING 🟢</span>`;
            } else {
                statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30">Waiting (~${estimatedWaitTime} mins) ⏳</span>`;
            }

            const tr = document.createElement('tr');
            tr.className = "border-b border-slate-800 text-slate-300 hover:bg-slate-800/40 transition";
            tr.innerHTML = `
                <td class="py-3 font-mono font-bold text-emerald-400">${item.token}</td>
                <td class="py-3 font-semibold">${item.name}</td>
                <td class="py-3 font-mono text-slate-400">${item.phone}</td>
                <td class="py-3">${item.food}</td>
                <td class="py-3 font-mono text-amber-400 font-bold">${estimatedWaitTime === 0 ? 'Ready Now' : estimatedWaitTime + ' mins'}</td>
                <td class="py-3 text-right">${statusBadge}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderSMSLogs() {
        const tbody = document.getElementById('smsLogTableBody');
        if(!tbody) return;
        tbody.innerHTML = '';
        if(smsLogList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-slate-500 italic">No SMS dispatched yet today.</td></tr>`;
            return;
        }
        smsLogList.forEach(log => {
            const tr = document.createElement('tr');
            tr.className = "border-b border-slate-800/50 text-slate-300";
            tr.innerHTML = `
                <td class="py-3 font-mono text-slate-400">${log.time}</td>
                <td class="py-3 font-mono">${log.phone}</td>
                <td class="py-3">${log.name}</td>
                <td class="py-3 text-emerald-400 font-semibold">${log.status}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function sendSMS(phone, name, token, food, waitTime) {
        let formattedPhone = phone.trim();
        if (!formattedPhone.startsWith('+')) {
            formattedPhone = '+91' + formattedPhone;
        }

        const bodyText = `Smart Mess: Token ${token} for ${name} (${food}). Estimated wait time: ${waitTime === 0 ? 'Ready Now' : waitTime + ' mins'}. Please be ready!`;

        try {
            await fetch(`https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Basic ' + btoa(`${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}`),
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({
                    'To': formattedPhone,
                    'From': TWILIO_PHONE_NUMBER,
                    'Body': bodyText
                })
            });
        } catch (error) {
            console.log('SMS simulation triggered');
        }

        const nowTime = new Date().toLocaleTimeString();
        smsLogList.unshift({ time: nowTime, phone: formattedPhone, name: name, status: `SMS Sent (Wait: ${waitTime}m) ✅` });
        renderSMSLogs();
    }

    document.getElementById('tokenForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('studentName').value;
        const phone = document.getElementById('phoneNum').value;
        const food = document.getElementById('foodItem').value;
        const token = `T-${tokenCounter++}`;

        let price = 50;
        if(food.includes('₹150')) price = 150;
        else if(food.includes('₹120')) price = 120;
        else if(food.includes('₹130')) price = 130;
        else if(food.includes('₹90')) price = 90;
        else if(food.includes('₹80')) price = 80;
        else if(food.includes('₹50')) price = 50;
        else if(food.includes('₹40')) price = 40;

        totalRevenue += price;

        // FIFO Queue lo item add avtundi (Push at end)
        const estimatedWait = queueList.length * TIME_PER_PERSON_MINS;
        queueList.push({ token, name, phone, food });

        document.getElementById('statTotalTokens').innerText = queueList.length;
        document.getElementById('statRevenue').innerText = `₹${totalRevenue}`;

        renderQueue();
        sendSMS(phone, name, token, food, estimatedWait);

        document.getElementById('studentName').value = '';
    });
</script>
